<html lang="ja">
<head>
    <meta charset="utf-8">
    <title>演習課題5-2：外部APIの呼び出しテスト</title>
</head>
<body>
    <h1 id="msg">何かのAPI</h1>
    <form name="apiform"><p>
        何かのフォーム：<input type="text" name="form_data">
        <button type="button" id="btn1" onclick="some_api(this.form)">実行</button>
    </p></form>
    
    <div id="result"></div>
    <script>
        async function some_api(myForm) {
            // ここにコードを書く
            async function searchYoutube() {
            const apiKey = "AIzaSyC9KZUQ_2GB5gqMnokMR4lcivZQVqyodQ8"; // YouTube APIキーを入力
            const query = document.getElementById("searchQuery").value;
            const apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${query}&type=video&maxResults=5&key=${apiKey}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) {
                    throw new Error("ネットワークエラー");
                }
                const data = await response.json();

                let html = "<h2>検索結果</h2>";
                data.items.forEach(item => {
                    html += `
                        <div>
                            <a href="https://www.youtube.com/watch?v=${item.id.videoId}" target="_blank">
                                <img src="${item.snippet.thumbnails.default.url}" alt="サムネイル">
                                <p><strong>${item.snippet.title}</strong></p>
                            </a>
                        </div>
                    `;
                });
            
                 document.getElementById("result").innerHTML = html;
            } catch (error) {
                document.getElementById("result").innerHTML = `<p style="color:red;">エラー: ${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
